<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monopoly Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --accent: #38bdf8; --text: #f8fafc; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .screen { display: none; flex-direction: column; height: 100%; padding: 16px; box-sizing: border-box; }
    .active { display: flex; }
    .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    input, button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; }
    input { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
    .nav { display: flex; gap: 8px; margin-top: auto; }
    .nav button { flex: 1; margin: 0; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; }
    .nav button.active-tab { background: var(--accent); color: #000; }
    .log-box { flex: 1; overflow-y: auto; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Экран 1: Вход -->
  <div id="auth-screen" class="screen active">
    <h2>Монополия</h2>
    <div class="glass">
      <input type="text" id="player-name" placeholder="Имя игрока">
      <input type="text" id="room-code" placeholder="Код комнаты">
      <button type="button" onclick="window.handleJoinRoom()">Войти в игру</button>
      <button type="button" onclick="window.handleCreateRoom()" style="background: transparent; color: var(--accent); border: 1px solid var(--accent);">+ Создать комнату</button>
    </div>
  </div>

  <!-- Экран 2: Игра -->
  <div id="game-screen" class="screen">
    <div class="glass" style="display:flex; justify-content:space-between; align-items:center;">
      <div><b id="ui-name">-</b><br><small id="ui-credits">Кредиты: 0/3</small></div>
      <div style="text-align:right;"><span style="color:#4ade80; font-weight:bold;" id="ui-balance">$1500</span><br><small id="ui-turn">Круг: 0/10</small></div>
    </div>

    <div id="tab-game" class="tab-content" style="display:flex; flex-direction:column; flex:1;">
      <button type="button" id="btn-turn" onclick="window.handleTurn()" style="padding:20px; font-size:18px;">СДЕЛАТЬ ХОД</button>
      <button type="button" id="btn-credit" onclick="window.handleTakeCredit()" style="background:rgba(255,255,255,0.1); color:#fff;">Взять кредит $1000</button>
      <div class="glass log-box" id="log-list"></div>
    </div>

    <div id="tab-assets" class="tab-content" style="display:none; flex:1; overflow-y:auto;">
      <div class="glass" id="my-assets-list">У вас пока нет объектов</div>
    </div>

    <div id="tab-players" class="tab-content" style="display:none; flex:1; overflow-y:auto;">
      <div class="glass" id="players-list"></div>
    </div>

    <div class="nav">
      <button type="button" class="tab-btn active-tab" onclick="switchTab('tab-game', this)">ИГРА</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-assets', this)">АКТИВЫ</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-players', this)">ИГРОКИ</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
      document.getElementById(tabId).style.display = 'flex';
      btn.classList.add('active-tab');
    }
  </script>
</body>
</html>
